entity_graph_construction_settings = {
    keep = {
        method_name = "entity_graph_constructor"

        missing_entity_policy = "keep"
        missing_entity_description = "NO DESCRIPTION."
    }
}

community_clustering_settings = {
    hl_size10 = {
        method_name = "hierarchical_leiden"

        # Component
        max_cluster_size = 10
        use_lcc = true
    }

    na_hop1 = {
        method_name = "neighborhood_aggregation"

        # Component
        hop_size = 1
    }

    tf = {
        method_name = "triple_level_factorization"
    }
}

report_generation_settings = {
    llm = {
        method_name = "llm_based_report_generator"

        # LLM
        llm_provider = "openai"
        llm_model_name = "gpt-4o-mini"
        llm_max_new_tokens = 2048

        # Component
        prompt_template_name_or_path = "report_generation_01_zeroshot"
        relation_map = {
            "CID": "Chemical-Induce-Disease"
        }
        node_attr_keys = [
            "name",
            "entity_type",
            "description"
        ]
        edge_attr_keys = [
            "relation"
        ]

    }

    template = {
        method_name = "template_based_report_generator"

        # Component
        relation_map = {
            "CID": "Chemical-Induce-Disease"
        }
        node_attr_keys = [
            "name",
            "entity_type",
            "description"
        ]
        edge_attr_keys = [
            "relation"
        ]
    }
}

chunking_settings = {
    en_core_web_md_w100 = {
        method_name = "chunker"

        # Component
        spacy_model_name = en_core_web_md
        window_size = 100
    }

    en_core_sci_md_w100 = {
        method_name = "chunker"

        # Component
        spacy_model_name = en_core_sci_md
        window_size = 100
    }

}

passage_retrieval_settings = {
    contriever_msmarco_top10 = {
        method_name = "contriever"

        # Component
        model_name = "facebook/contriever-msmarco"
        max_passage_length = 512
        pooling_method = "average"
        normalize = false
        metric = "inner-product"

        indexing_batch_size = 1024

        search_batch_size = 10
        top_k = 10
    }

    qwen3_embedding_0.6b_top10 = {
        method_name = "qwen3_embedding"

        # Component
        model_name = "Qwen/Qwen3-Embedding-0.6B"
        max_passage_length = 8192
        normalize = true
        metric = "inner-product"
        query_instruction  = "Given a question, retrieve relevant passages that answer the question."

        indexing_batch_size = 32
        top_k = 10
    }
}

qa_settings = {
    gpt4o = {
        method_name = "llm_qa"

        # LLM
