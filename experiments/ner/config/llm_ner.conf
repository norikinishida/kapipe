####################
# Model
####################

# Llama-3.1-70B-Instruct
llama3_1_70b = {
    # Model
    provider = "hf"
    model_name = meta-llama/Meta-Llama-3.1-70B-Instruct
    max_new_tokens = 512
    quantization_bits = 4
    prompt_template_name_or_path = "ner_13_fewshot"
}

# GPT-4o-mini
gpt4omini = {
    # Model
    provider = "openai"
    model_name = "gpt-4o-mini"
    max_new_tokens = 512
    prompt_template_name_or_path = "ner_13_fewshot"
}

####################
# Model x Dataset
####################

# GPT-4o-mini x CoNLL2003
gpt4omini_conll2003 = ${gpt4omini}{
    # Dataset
    dataset_name = conll2003
    allow_nested_entities = false
}

#####

# GPT-4o-mini x Linked-DocRED
gpt4omini_linked_docred = ${gpt4omini}{
    # Dataset
    dataset_name = linked_docred
    allow_nested_entities = true
}

######

# Llama-3.1-70B-Instruct x CDR
llama3_1_70b_cdr = ${llama3_1_70b}{
    # Dataset
    dataset_name = cdr
    allow_nested_entities = true
}

# GPT-4o-mini x CDR
gpt4omini_cdr = ${gpt4omini}{
    # Dataset
    dataset_name = cdr
    allow_nested_entities = true
}

######

# GPT-4o-mini x MedMentions
gpt4omini_medmentions = ${gpt4omini}{
    # Dataset
    dataset_name = medmentions
    allow_nested_entities = true
}

