        relations = [
            "works_for",
            "located_in"
        ]
        rel_meta_info = {
            "works_for": {
                "Pretty Name": "Works-For",
                "Definition": "The subject person works for the object organization."
            },
            "located_in": {
                "Pretty Name": "Located-In",
                "Definition": "The subject entity is located in the object location."
            }
        }
    }
}

