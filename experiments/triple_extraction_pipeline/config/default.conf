ner_settings = {
    biaffine_ner_cdr = {
        method_name = "biaffine_ner"

        # Component
        identifier = "biaffine_ner_cdr"
    }
 
    llm_ner_cdr = {
        method_name = "llm_ner"

        # LLM
        llm_provider = "openai"
        llm_model_name = "gpt-5.4-nano"
        llm_max_new_tokens = 8192

        # Component
        identifier = "llm_ner_cdr"
    }

    llm_ner_user_defined = {
        method_name = "llm_ner"

        # LLM
        llm_provider = "openai"
        llm_model_name = "gpt-5.4-nano"
        llm_max_new_tokens = 8192

        # Component
        prompt_template_name_or_path = "ner_15_zeroshot"

        # User-defined schema
        entity_types = [
            "Person",
            "Organization",
            "Location"
        ]
        etype_meta_info = {
            "Person": {
                "Pretty Name": "Person",
                "Definition": "A human individual."
            },
            "Organization": {
                "Pretty Name": "Organization",
                "Definition": "A formal group, institution, or company."
            },
            "Location": {
                "Pretty Name": "Location",
                "Definition": "A geographic place."
            }
        }
    }
}

ed_retrieval_settings = {
   mention_name = {
        method_name = "mention_name_entity_retriever"

        # Component
        retrieval_size = 1
   }

    blink_bi_encoder_cdr = {
        method_name = "blink_bi_encoder"

        # Component
        identifier = "blink_bi_encoder_cdr"
        retrieval_size = 10
    }
}

ed_reranking_settings = {
    identical = {
        method_name = "identical_entity_reranker"
    }

    blink_cross_encoder_cdr = {
        method_name = "blink_cross_encoder"

        # Component
        identifier = "blink_cross_encoder_cdr"
    }

    llm_ed_cdr = {
        method_name = "llm_ed"

        # LLM
        llm_provider = "openai"
        llm_model_name = "gpt-5.4-nano"
        llm_max_new_tokens = 8192

        # Component
        identifier = "llm_ed_cdr"
    }
}

docre_settings = {
    atlop_cdr = {
        method_name = "atlop"

        # Component
        identifier = "atlop_cdr"
    }
 
    llm_docre_cdr = {
        method_name = "llm_docre"

        # LLM
        llm_provider = "openai"
        llm_model_name = "gpt-5.4-nano"
        llm_max_new_tokens = 8192

        # Component
        identifier = "llm_docre_cdr"
    }
 
    llm_docre_user_defined = {
        method_name = "llm_docre"

        # LLM
        llm_provider = "openai"
        llm_model_name = "gpt-5.4-nano"
        llm_max_new_tokens = 8192

        # Component
        prompt_template_name_or_path = "docre_10_zeroshot"
        knowledge_base_name = "User-defined KB"
        mention_style = "all_mentions"
        with_span_annotation = true

        # User-defined schema
        possible_head_entity_types = null
        possible_tail_entity_types = null
        relations = [
            "works_for",
            "located_in"
        ]
        rel_meta_info = {
            "works_for": {
                "Pretty Name": "Works-For",
                "Definition": "The subject person works for the object organization."
            },
            "located_in": {
                "Pretty Name": "Located-In",
                "Definition": "The subject entity is located in the object location."
            }
        }
    }
 
}

slm_cdr = {
    ner = ${ner_settings.biaffine_ner_cdr}
    ed_retrieval = ${ed_retrieval_settings.blink_bi_encoder_cdr}
    ed_reranking = ${ed_reranking_settings.blink_cross_encoder_cdr}
    docre = ${docre_settings.atlop_cdr}
}

llm_cdr = {
    ner = ${ner_settings.llm_ner_cdr}
    ed_retrieval = ${ed_retrieval_settings.blink_bi_encoder_cdr}
    ed_reranking = ${ed_reranking_settings.llm_ed_cdr}
    docre = ${docre_settings.llm_docre_cdr}
}

llm_user_defined = {
    ner = ${ner_settings.llm_ner_user_defined}
    ed_retrieval = ${ed_retrieval_settings.mention_name}
    ed_reranking = ${ed_reranking_settings.identical}
    docre = ${docre_settings.llm_docre_user_defined}
}
