                "Definition": "A geographic place."
            }
        }
    }

    ed_retrieval = {
        method = "mention_name_entity_retriever"

        # Component
        retrieval_size = 1
    }

    ed_reranking = {
        method = "identical_entity_reranker"
    }

    docre = {
        method = "llm_docre"

        # LLM
        llm_provider = "openai"
        llm_model_name = "gpt-5.4-nano"
        llm_max_new_tokens = 1024

        # Component
        prompt_template_name_or_path = "docre_08_zeroshot"
        knowledge_base_name = "User-defined KB"
