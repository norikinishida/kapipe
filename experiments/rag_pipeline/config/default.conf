passage_retrieval_settings = {
    qwen3_embedding_06b_top3 = {
        method_name = "qwen3_embedding"

        # Component
        model_name = "Qwen/Qwen3-Embedding-0.6B"
        max_passage_length = 8192
        normalize = true
        metric = "inner-product"
        query_instruction  = "Given a question, retrieve relevant passages that answer the question."

        indexing_batch_size = 32
        top_k = 3
    }
}

qa_settings = {
    gpt5_4_nano = {
        method_name = "llm_qa"

        # LLM
        llm_provider = "openai"
        llm_model_name = "gpt-5.4-nano"
        llm_max_new_tokens = 8192

        # Component
        prompt_template_name_or_path = "qa_04_with_context"
        n_contexts = -1
    }
}

qwen3_embedding_06b___gpt5_4_nano = {
    passage_retrieval = ${passage_retrieval_settings.qwen3_embedding_06b_top3}
    qa = ${qa_settings.gpt5_4_nano}
}