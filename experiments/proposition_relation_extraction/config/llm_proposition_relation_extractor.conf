bm25 = {
    method_name = "bm25"
    k1 = 1.5
    b = 0.75

    search_batch_size = 10
    prefilter_k = 100
    top_k = 20
}

contriever = {
    method_name = "contriever"
    model_name = "facebook/contriever-msmarco"
    max_passage_length = 512
    pooling_method = "average"
    normalize = false
    metric = "inner-product"

    indexing_batch_size = 1024
    search_batch_size = 10
    prefilter_k = 100
    top_k = 20
}

qwen3_embedding = {
    method_name = "qwen3_embedding"
    model_name = "Qwen/Qwen3-Embedding-0.6B"
    max_passage_length = 8192
    normalize = true
    metric = "inner-product"
    query_instruction = "Given a proposition, retrieve related propositions."

    indexing_batch_size = 32
    search_batch_size = 10
    prefilter_k = 100
    top_k = 20
}

# GPT-5.4-nano
gpt5_4_nano_contriever_temporal = {
    # LLM
    llm_provider = "openai"
    llm_model_name = "gpt-5.4-nano"
    llm_max_new_tokens = 2048

    # Retriever
    retriever = ${contriever}

    # Component
    prompt_template_name_or_path = "proposition_relation_extraction_01_with_timestamp"
    use_timestamp = true
}

# Llama-3.1-70B-Instruct
llama3_1_70b_contriever_temporal = {
    # LLM
    llm_provider = "hf"
    llm_model_name = "meta-llama/Meta-Llama-3.1-70B-Instruct"
    llm_max_new_tokens = 2048
    llm_quantization_bits = 4

    # Retriever
    retriever = ${contriever}

    # Component
    prompt_template_name_or_path = "proposition_relation_extraction_01_with_timestamp"
    use_timestamp = true
}
