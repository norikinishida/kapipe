proposition_extraction_settings = {
    gpt4o_mini = {
        method_name = "llm_proposition_extractor"

        # LLM
        llm_provider = "openai"
        llm_model_name = "gpt-4o-mini"
        llm_max_new_tokens = 2048

        # Component
        prompt_template_name_or_path = "proposition_extraction_01"
    }
}

proposition_relation_extraction_settings = {
    gpt4o_mini_contriever_top20_temporal = {
        method_name = "llm_proposition_relation_extractor"

        # LLM
        llm_provider = "openai"
        llm_model_name = "gpt-4o-mini"
        llm_max_new_tokens = 2048

        # Retriever
        retriever = {
            method_name = "contriever"

            # Component
            model_name = "facebook/contriever-msmarco"
            max_passage_length = 512
            pooling_method = "average"
            normalize = false
            metric = "inner-product"

            indexing_batch_size = 1024

            search_batch_size = 100
            prefilter_k = 100
            top_k = 20
        }

        # Component
        prompt_template_name_or_path = "proposition_relation_extraction_01_with_timestamp"
        use_timestamp = true
    }
}

