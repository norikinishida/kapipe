####################
# Model
####################

# Llama3.1-70B-Instruct
llama3_1_70b = {
    # Model
    provider = "hf"
    model_name = meta-llama/Meta-Llama-3.1-70B-Instruct
    max_new_tokens = 512
    quantization_bits = 4
    prompt_template_name_or_path = "ed_10_fewshot"
}

# GPT-4o-mini
gpt4omini = {
    # Model
    provider = "openai"
    model_name = "gpt-4o-mini"
    max_new_tokens = 512
    prompt_template_name_or_path = "ed_10_fewshot"
}

####################
# Model x Dataset
####################

# GPT-4o-mini x Linked-DocRED
gpt4omini_linked_docred = ${gpt4omini}{
    # Dataset
    dataset_name = linked_docred
    knowledge_base_name = Wikipedia
}

######

# Llama-3.1-70B-Instruct x CDR
llama3_1_70b_cdr = ${llama3_1_70b}{
    # Dataset
    dataset_name = cdr
    knowledge_base_name = MeSH
}

# GPT-4o-mini x CDR
gpt4omini_cdr = ${gpt4omini}{
    # Dataset
    dataset_name = cdr
    knowledge_base_name = MeSH
}

######

# GPT-4o-mini x MedMentions
gpt4omini_medmentions = ${gpt4omini}{
    # Dataset
    dataset_name = medmentions
    knowledge_base_name = UMLS
}