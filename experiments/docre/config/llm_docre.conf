####################
# Model
####################

# Llama-3.1-70B-Instruct
llama3_1_70b = {
    # LLM
    provider = "hf"
    model_name = "meta-llama/Meta-Llama-3.1-70B-Instruct"
    max_new_tokens = 512
    quantization_bits = 4

    # Component
    prompt_template_name_or_path = "docre_08_fewshot"
}

# GPT-4o-mini
gpt4omini = {
    # LLM
    provider = "openai"
    model_name = "gpt-4o-mini"
    max_new_tokens = 512

    # Component
    prompt_template_name_or_path = "docre_08_fewshot"
}

####################
# Model x Dataset
####################

# GPT-4o-mini x DocRED
gpt4omini_docred = ${gpt4omini}{
    # Component
    knowledge_base_name = Wikipedia
    mention_style = all_mentions
    with_span_annotation = true
    possible_head_entity_types = null
    possible_tail_entity_types = null

    # Trainer
    use_official_evaluation = true
}

